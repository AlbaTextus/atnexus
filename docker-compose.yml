name: atnexus

services:
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
      POSTGRES_DB: oauth
    ports:
      - "5432:5432"
    volumes:
      - oauth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth -d oauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  athub-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: athub
      POSTGRES_PASSWORD: athub
      POSTGRES_DB: athub
    ports:
      - "5433:5432"
    volumes:
      - athub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athub -d athub"]
      interval: 5s
      timeout: 5s
      retries: 10

  creatplat-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${CREATPLAT_POSTGRES_USER:-creatplat}
      POSTGRES_PASSWORD: ${CREATPLAT_POSTGRES_PASSWORD:?Set CREATPLAT_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${CREATPLAT_POSTGRES_DB:-creatplat}
    ports:
      - "${CREATPLAT_POSTGRES_PORT:-5434}:5432"
    volumes:
      - creatplat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  atnexus:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8001
      ATHUB_HTTP_ADDR: :8005
      CREATPLAT_HTTP_ADDR: :8004
      IMAGE_HTTP_ADDR: :8002
      IMAGE_DATABASE_URL: ${IMAGE_COMPOSE_DATABASE_URL:?Set IMAGE_COMPOSE_DATABASE_URL to the independent image database}
      IMAGE_LOCAL_ROOT: /data/images
      IMAGE_TEMP_ROOT: /var/lib/atnexus/image-temp
      IMAGE_PUBLIC_URL: ${IMAGE_PUBLIC_URL:?Set IMAGE_PUBLIC_URL to the public image origin}
      IMGBED_URL: ${IMGBED_COMPOSE_URL:-http://127.0.0.1:8002}
      IMGBED_API_TOKEN: ${IMGBED_API_TOKEN:-}
      DATABASE_URL: postgresql://oauth:oauth@postgres:5432/oauth?sslmode=disable
      ATHUB_DATABASE_URL: postgresql://athub:athub@athub-postgres:5432/athub?sslmode=disable
      CREATPLAT_DATABASE_URL: ${CREATPLAT_COMPOSE_DATABASE_URL:?Set CREATPLAT_COMPOSE_DATABASE_URL using the creatplat-postgres host}
      CREATPLAT_MIGRATION_CHECK_TIMEOUT: ${CREATPLAT_MIGRATION_CHECK_TIMEOUT:-10m}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_COMPOSE_URL:-redis://redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-albatextus:connect}
      REDIS_SESSION_TTL: ${REDIS_SESSION_TTL:-30s}
      ISSUER_URL: http://localhost:3288
      AUTH_UI_URL: http://localhost:3288
      WEBAUTHN_RP_ORIGINS: http://localhost:3288
      COOKIE_SECURE: "false"
      CLIENT_SECRET_ENCRYPTION_KEY: ${CLIENT_SECRET_ENCRYPTION_KEY:?Set CLIENT_SECRET_ENCRYPTION_KEY in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINUXDO_CLIENT_ID: ${LINUXDO_CLIENT_ID:-}
      LINUXDO_CLIENT_SECRET: ${LINUXDO_CLIENT_SECRET:-}
      CUSTOM_OAUTH_NAME: ${CUSTOM_OAUTH_NAME:-其他账号}
      CUSTOM_OAUTH_CLIENT_ID: ${CUSTOM_OAUTH_CLIENT_ID:-}
      CUSTOM_OAUTH_CLIENT_SECRET: ${CUSTOM_OAUTH_CLIENT_SECRET:-}
      CUSTOM_OAUTH_AUTHORIZATION_URL: ${CUSTOM_OAUTH_AUTHORIZATION_URL:-}
      CUSTOM_OAUTH_TOKEN_URL: ${CUSTOM_OAUTH_TOKEN_URL:-}
      CUSTOM_OAUTH_USERINFO_URL: ${CUSTOM_OAUTH_USERINFO_URL:-}
      CUSTOM_OAUTH_SCOPES: ${CUSTOM_OAUTH_SCOPES:-openid,profile,email}
      CUSTOM_OAUTH_SUBJECT_FIELD: ${CUSTOM_OAUTH_SUBJECT_FIELD:-sub}
      CUSTOM_OAUTH_EMAIL_FIELD: ${CUSTOM_OAUTH_EMAIL_FIELD:-email}
      CUSTOM_OAUTH_EMAIL_VERIFIED_FIELD: ${CUSTOM_OAUTH_EMAIL_VERIFIED_FIELD:-email_verified}
      CUSTOM_OAUTH_NAME_FIELD: ${CUSTOM_OAUTH_NAME_FIELD:-name}
    ports:
      - "8001:8001"
      - "8002:8002"
      - "8004:8004"
      - "8005:8005"
    volumes:
      - type: bind
        source: ${IMAGE_COMPOSE_LOCAL_ROOT:?Set IMAGE_COMPOSE_LOCAL_ROOT to the existing image directory}
        target: /data/images
        bind:
          create_host_path: false
      # Resumable chunk uploads must survive a container rebuild.
      - image-temp:/var/lib/atnexus/image-temp
    healthcheck:
      test: ["CMD", "/atnexus", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Startup includes the legacy creator data check.
      start_period: ${CREATPLAT_MIGRATION_CHECK_TIMEOUT:-10m}
    depends_on:
      postgres:
        condition: service_healthy
      athub-postgres:
        condition: service_healthy
      creatplat-postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        OAUTH_BACKEND_URL: http://atnexus:8001
        CREATPLAT_BACKEND_URL: http://atnexus:8004
        NEXT_PUBLIC_WIKI_URL: ${NEXT_PUBLIC_WIKI_URL:-http://localhost:3200}
        NEXT_PUBLIC_ATHUB_API_URL: ${NEXT_PUBLIC_ATHUB_API_URL:-http://localhost:8005}
        NEXT_PUBLIC_CREATPLAT_API_URL: ${NEXT_PUBLIC_CREATPLAT_API_URL:-http://localhost:8004}
    environment:
      OAUTH_BACKEND_URL: http://atnexus:8001
      CREATPLAT_BACKEND_URL: http://atnexus:8004
    ports:
      - "3288:3288"
    depends_on:
      atnexus:
        condition: service_healthy

volumes:
  oauth-postgres:
    # Keep the original database volumes when upgrading from the oauth project.
    name: ${ACCOUNT_POSTGRES_VOLUME:-oauth_oauth-postgres}
  athub-postgres:
    name: ${ATHUB_POSTGRES_VOLUME:-oauth_athub-postgres}
  creatplat-postgres:
    name: ${CREATPLAT_POSTGRES_VOLUME:-atnexus_creatplat-postgres}
  image-temp:
