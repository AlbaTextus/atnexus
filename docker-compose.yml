services:
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oauth
      POSTGRES_PASSWORD: oauth
      POSTGRES_DB: oauth
    ports:
      - "5432:5432"
    volumes:
      - oauth-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oauth -d oauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  oauth:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://oauth:oauth@postgres:5432/oauth?sslmode=disable
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_URL: ${REDIS_COMPOSE_URL:-redis://redis:6379/0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-albatextus:connect}
      REDIS_SESSION_TTL: ${REDIS_SESSION_TTL:-30s}
      ISSUER_URL: http://localhost:3000
      AUTH_UI_URL: http://localhost:3000
      COOKIE_SECURE: "false"
      CLIENT_SECRET_ENCRYPTION_KEY: ${CLIENT_SECRET_ENCRYPTION_KEY:?Set CLIENT_SECRET_ENCRYPTION_KEY in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LINUXDO_CLIENT_ID: ${LINUXDO_CLIENT_ID:-}
      LINUXDO_CLIENT_SECRET: ${LINUXDO_CLIENT_SECRET:-}
      CUSTOM_OAUTH_NAME: ${CUSTOM_OAUTH_NAME:-其他账号}
      CUSTOM_OAUTH_CLIENT_ID: ${CUSTOM_OAUTH_CLIENT_ID:-}
      CUSTOM_OAUTH_CLIENT_SECRET: ${CUSTOM_OAUTH_CLIENT_SECRET:-}
      CUSTOM_OAUTH_AUTHORIZATION_URL: ${CUSTOM_OAUTH_AUTHORIZATION_URL:-}
      CUSTOM_OAUTH_TOKEN_URL: ${CUSTOM_OAUTH_TOKEN_URL:-}
      CUSTOM_OAUTH_USERINFO_URL: ${CUSTOM_OAUTH_USERINFO_URL:-}
      CUSTOM_OAUTH_SCOPES: ${CUSTOM_OAUTH_SCOPES:-openid,profile,email}
      CUSTOM_OAUTH_SUBJECT_FIELD: ${CUSTOM_OAUTH_SUBJECT_FIELD:-sub}
      CUSTOM_OAUTH_EMAIL_FIELD: ${CUSTOM_OAUTH_EMAIL_FIELD:-email}
      CUSTOM_OAUTH_EMAIL_VERIFIED_FIELD: ${CUSTOM_OAUTH_EMAIL_VERIFIED_FIELD:-email_verified}
      CUSTOM_OAUTH_NAME_FIELD: ${CUSTOM_OAUTH_NAME_FIELD:-name}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        OAUTH_BACKEND_URL: http://oauth:8080
        NEXT_PUBLIC_WIKI_URL: ${NEXT_PUBLIC_WIKI_URL:-http://localhost:3200}
    environment:
      OAUTH_BACKEND_URL: http://oauth:8080
    ports:
      - "3000:3000"
    depends_on:
      - oauth

volumes:
  oauth-postgres:
